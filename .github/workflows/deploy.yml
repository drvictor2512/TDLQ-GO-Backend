name: CI/CD Microservices

on:
  push:
    branches: [ "main" ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      user: ${{ steps.filter.outputs.user }}
      product: ${{ steps.filter.outputs.product }}
      order: ${{ steps.filter.outputs.order }}
      cart: ${{ steps.filter.outputs.cart }}
      gateway: ${{ steps.filter.outputs.gateway }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user: 'TLDQ-GO-USER-SERVICE/**'
            product: 'TLDQ-GO-PRODUCT-SERVICE/**'
            order: 'TLDQ-GO-ORDER-SERVICE/**'
            cart: 'TLDQ-GO-CART-SERVICE/**'
            gateway: 'TLDQ-GO-API-GATEWAY/**'

  build-and-deploy:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push User
        if: needs.changes.outputs.user == 'true'
        run: |
          docker build -t thangtranvan2512/user-service:latest ./TLDQ-GO-USER-SERVICE
          docker push thangtranvan2512/user-service:latest

      - name: Build & Push Product
        if: needs.changes.outputs.product == 'true'
        run: |
          docker build -t thangtranvan2512/product-service:latest ./TLDQ-GO-PRODUCT-SERVICE
          docker push thangtranvan2512/product-service:latest

      - name: Build & Push Order
        if: needs.changes.outputs.order == 'true'
        run: |
          docker build -t thangtranvan2512/order-service:latest ./TLDQ-GO-ORDER-SERVICE
          docker push thangtranvan2512/order-service:latest

      - name: Build & Push Cart
        if: needs.changes.outputs.cart == 'true'
        run: |
          docker build -t thangtranvan2512/cart-service:latest ./TLDQ-GO-CART-SERVICE
          docker push thangtranvan2512/cart-service:latest

      - name: Build & Push Gateway
        if: needs.changes.outputs.gateway == 'true'
        run: |
          docker build -t thangtranvan2512/api-gateway:latest ./TLDQ-GO-API-GATEWAY
          docker push thangtranvan2512/api-gateway:latest

      - name: SSH to EC2 & Update Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app-deploy

            ${{ needs.changes.outputs.user == 'true' && 'docker compose pull user && docker compose up -d --no-deps user' || '' }}
            ${{ needs.changes.outputs.product == 'true' && 'docker compose pull product && docker compose up -d --no-deps product' || '' }}
            ${{ needs.changes.outputs.order == 'true' && 'docker compose pull order && docker compose up -d --no-deps order' || '' }}
            ${{ needs.changes.outputs.cart == 'true' && 'docker compose pull cart && docker compose up -d --no-deps cart' || '' }}
            ${{ needs.changes.outputs.gateway == 'true' && 'docker compose pull api-gateway && docker compose up -d --no-deps api-gateway' || '' }}

            docker image prune -f
