services:
  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: always
    networks:
      - micro-network

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - micro-network

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672" # AMQP port — services dùng để connect
      - "15672:15672" # Management UI — truy cập http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - micro-network

  api-gateway:
    container_name: api-gateway
    build: ./TLDQ-GO-API-GATEWAY
    image: "thangtranvan2512/api-gateway:latest"
    ports:
      - "3000:3000"
    env_file:
      - ./TLDQ-GO-API-GATEWAY/.env
    depends_on:
      user:
        condition: service_healthy
      product:
        condition: service_healthy
      order:
        condition: service_healthy
      cart:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - micro-network

  user:
    container_name: user-service
    image: "thangtranvan2512/user-service:latest"
    build: ./TLDQ-GO-USER-SERVICE
    ports:
      - "3001:3001"
    env_file:
      - ./TLDQ-GO-USER-SERVICE/.env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - micro-network

  product:
    container_name: product-service
    image: "thangtranvan2512/product-service:latest"
    build: ./TLDQ-GO-PRODUCT-SERVICE
    ports:
      - "3002:3002"
    env_file:
      - ./TLDQ-GO-PRODUCT-SERVICE/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - micro-network

  cart:
    container_name: cart-service
    image: "thangtranvan2512/cart-service:latest"
    build: ./TLDQ-GO-CART-SERVICE
    ports:
      - "3004:3004"
    environment:
      - REDIS_URL=redis://redis:6379
      - CART_SERVICE_PORT=3004
      - PRODUCT_SERVICE_URL=http://product:3002
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3004/health', r => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - micro-network

  order:
    container_name: order-service
    image: "thangtranvan2512/order-service:latest"
    build: ./TLDQ-GO-ORDER-SERVICE
    ports:
      - "3003:3003"
    env_file:
      - ./TLDQ-GO-ORDER-SERVICE/.env
    environment:
      - USER_SERVICE_URL=http://user:3001
      - PRODUCT_SERVICE_URL=http://product:3002
      - GATEWAY_URL=http://api-gateway:3000
      - VNPAY_PAYMENT_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - VNPAY_RETURN_URL=http://localhost:5173/thanh-toan/ket-qua
    depends_on:
      rabbitmq:
        condition: service_healthy
      user:
        condition: service_healthy
      product:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3003/health', r => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - micro-network

networks:
  micro-network:
    driver: bridge
