services:
  api-gateway:
    container_name: api-gateway
    build: ./TLDQ-GO-API-GATEWAY
    image: "thangtranvan2512/api-gateway:latest"
    ports:
      - "3000:3000"
    env_file:
      - ./TLDQ-GO-API-GATEWAY/.env
    depends_on:
      - user
      - product
      - order
    restart: always
    networks:
      - micro-network

  user:
    container_name: user-service
    image: "thangtranvan2512/user-service:latest"
    build: ./TLDQ-GO-USER-SERVICE
    ports:
      - "3001:3001"
    env_file:
      - ./TLDQ-GO-USER-SERVICE/.env
    restart: always
    networks:
      - micro-network

  product:
    container_name: product-service
    image: "thangtranvan2512/product-service:latest"
    build: ./TLDQ-GO-PRODUCT-SERVICE
    ports:
      - "3002:3002"
    env_file:
      - ./TLDQ-GO-PRODUCT-SERVICE/.env
    restart: always
    networks:
      - micro-network

  order:
    container_name: order-service
    image: "thangtranvan2512/order-service:latest"
    build: ./TLDQ-GO-ORDER-SERVICE
    ports:
      - "3003:3003"
    env_file:
      - ./TLDQ-GO-ORDER-SERVICE/.env
    restart: always
    networks:
      - micro-network

networks:
  micro-network:
    driver: bridge
